<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <meta name="application-name" content="PersonalNWS Alpha">
  <meta name="apple-mobile-web-app-title" content="PersonalNWS Alpha">
  <meta property="og:title" content="PersonalNWS Alpha">
  <meta name="twitter:title" content="PersonalNWS Alpha">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>PersonalNWS Alpha</title>


  <style>
    :root{
      --bg:#050506;--panel:#0b0b0e;--panel2:#111116;--line:#2b2b32;
      --text:#f4f4f7;--muted:#9b9ba6;--purple:#8b5cf6;--purple2:#b7a4ff;
      --ok:#55d6a2;--warn:#efba52;--bad:#ef6464;--h:31px
    }
    *{box-sizing:border-box}
    html,body,#map{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);font-size:12px;font-variant-numeric:tabular-nums}
    button,select,input{font:inherit}
    #map{position:fixed;inset:0}
    .maplibregl-ctrl-bottom-left{bottom:50px}
    .maplibregl-ctrl-bottom-right{bottom:50px}
    .maplibregl-ctrl-attrib{background:rgba(5,5,6,.72)!important;color:#8e8e98!important;font-size:9px!important}
    .maplibregl-ctrl-attrib a{color:#b0b0ba!important}

    #status{
      position:fixed;z-index:20;left:10px;top:10px;height:29px;max-width:calc(100vw - 20px);
      display:flex;align-items:center;gap:7px;padding:0 9px;background:rgba(7,7,9,.92);
      border:1px solid var(--line);border-radius:3px;backdrop-filter:blur(5px);white-space:nowrap
    }
    #dot{width:6px;height:6px;border-radius:50%;background:#70707a;flex:none}
    #dot.live{background:var(--ok)} #dot.loading{background:var(--purple2)}
    #dot.warn{background:var(--warn)} #dot.bad{background:var(--bad)}
    #site{font-weight:700;letter-spacing:.02em}
    #detail,#history,#stream{color:var(--muted);font-size:10px}
    #stream.live{color:#76deb3}

    #controls{
      position:fixed;z-index:25;left:10px;bottom:57px;display:flex;gap:4px;align-items:center;
      max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none
    }
    #controls::-webkit-scrollbar{display:none}
    .ctl{
      height:var(--h);border:1px solid var(--line);border-radius:3px;background:rgba(11,11,14,.95);
      color:var(--text);outline:none;white-space:nowrap
    }
    select.ctl{appearance:none;padding:0 25px 0 8px;background-image:
      linear-gradient(45deg,transparent 50%,#9b9ba5 50%),
      linear-gradient(135deg,#9b9ba5 50%,transparent 50%);
      background-position:calc(100% - 11px) 13px,calc(100% - 7px) 13px;
      background-size:4px 4px,4px 4px;background-repeat:no-repeat
    }
    .ctl:hover{border-color:#4b4b56;background-color:#131318}
    .ctl:focus-visible,#timeline:focus-visible{outline:1px solid var(--purple);outline-offset:1px}
    #product{min-width:128px} #tilt{min-width:75px} #speed{min-width:64px}
    button.ctl{padding:0 9px;cursor:pointer}
    button.ctl.active{border-color:#6d50b8;background:#17121f;color:#d6caff}

    #readout{
      position:fixed;z-index:20;right:10px;bottom:58px;height:28px;min-width:170px;
      display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 8px;
      border:1px solid var(--line);border-radius:3px;background:rgba(7,7,9,.9);pointer-events:none
    }
    #coords{color:var(--muted)} #value{font-weight:700}

    #timelineWrap{
      position:fixed;z-index:24;left:0;right:0;bottom:0;height:49px;padding:6px 12px 3px;
      background:rgba(5,5,7,.96);border-top:1px solid #24242a
    }
    #timeline{appearance:none;width:100%;height:18px;margin:0;background:transparent;cursor:pointer}
    #timeline::-webkit-slider-runnable-track{height:4px;background:#303038;border-radius:1px}
    #timeline::-webkit-slider-thumb{appearance:none;width:12px;height:12px;margin-top:-4px;border-radius:50%;background:var(--purple);border:1px solid #d3c8ff}
    #timeline::-moz-range-track{height:4px;background:#303038;border-radius:1px}
    #timeline::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--purple);border:1px solid #d3c8ff}
    #times{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;height:19px;color:#92929d;font-size:10px}
    #timeNow{text-align:center;color:#ededf1;font-weight:650}
    #timeRight{text-align:right}
    #cacheProgress{position:absolute;left:12px;right:12px;top:4px;height:1px;background:transparent;pointer-events:none}
    #cacheProgress>div{height:1px;background:var(--purple);width:0%;transition:width .15s linear}

    #toast{
      position:fixed;z-index:40;left:50%;top:11px;transform:translateX(-50%);
      display:none;align-items:center;height:28px;padding:0 9px;border:1px solid #383841;border-radius:3px;
      background:#0b0b0e;color:#e8e8ed;box-shadow:none
    }

    #disclaimer{
      position:fixed;z-index:20;right:10px;top:10px;color:#7e7e88;font-size:9px;
      background:rgba(5,5,6,.72);padding:4px 6px;border-radius:2px;pointer-events:none
    }

    .radar-popup{font-size:11px}
    .maplibregl-popup-content{
      background:#0b0b0e;color:#f4f4f7;border:1px solid #2b2b32;border-radius:3px;
      padding:8px 10px;box-shadow:none
    }
    .maplibregl-popup-tip{border-top-color:#0b0b0e!important;border-bottom-color:#0b0b0e!important}
    .maplibregl-popup-close-button{color:#9b9ba6}

    @media(max-width:720px){
      #status{left:7px;top:7px}
      #disclaimer{display:none}
      #controls{left:7px;right:7px;bottom:56px}
      #readout{display:none}
      #product{min-width:116px}
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="status">
    <span id="dot"></span>
    <span id="site">Select a radar</span>
    <span id="detail">click a station on the map</span>
    <span id="history"></span>
    <span id="stream"></span>
  </div>

  <div id="disclaimer">PERSONALNWS ALPHA · NOT AN OFFICIAL NWS PRODUCT</div>
  <div id="toast"></div>

  <div id="controls">
    <select id="product" class="ctl" aria-label="Radar product">
      <option value="REF">Reflectivity</option>
      <option value="VEL">Velocity</option>
      <option value="SW">Spectrum Width</option>
      <option value="ZDR">Differential Reflectivity</option>
      <option value="RHO">Correlation Coefficient</option>
      <option value="PHI">Differential Phase</option>
    </select>
    <select id="tilt" class="ctl" aria-label="Elevation">
      <option value="">—</option>
    </select>
    <select id="speed" class="ctl" aria-label="Playback speed">
      <option value=".5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
    </select>
    <button id="play" class="ctl" type="button">Play</button>
    <button id="tracks" class="ctl active" type="button">Tracks</button>
    <button id="cwa" class="ctl" type="button">CWA</button>
  </div>

  <div id="readout"><span id="coords">—</span><span id="value">—</span></div>

  <div id="timelineWrap">
    <div id="cacheProgress"><div></div></div>
    <input id="timeline" type="range" min="0" max="0" step="1" value="0" aria-label="Radar frame">
    <div id="times"><span id="timeLeft">—</span><span id="timeNow">—</span><span id="timeRight">—</span></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
