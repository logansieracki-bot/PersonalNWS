<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <meta name="application-name" content="PersonalNWS Alpha">
  <meta name="apple-mobile-web-app-title" content="PersonalNWS Alpha">
  <meta property="og:title" content="PersonalNWS Alpha">
  <meta name="twitter:title" content="PersonalNWS Alpha">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>PersonalNWS Alpha</title>
  <link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
  <div id="map"></div>

  <div id="status">
    <span id="dot"></span>
    <span id="site">Select a radar</span>
    <span id="detail">click a station on the map</span>
    <span id="history"></span>
    <span id="stream"></span>
  </div>

  <div id="disclaimer">PERSONAL DISPLAY · <span data-app-version>Alpha</span> · NOT AN OFFICIAL NWS PRODUCT</div>
  <div id="toast"></div>
  <div id="fatal" role="alert" aria-live="assertive">
    <strong>PersonalNWS runtime diagnostic</strong>
    <span id="fatalText">Unknown error</span>
    <div id="fatalCode"></div>
    <button id="fatalCopy" type="button">Copy Debug Report</button>
  </div>

  <div id="controls">
    <select id="product" class="ctl" aria-label="Radar product">
      <option value="1">Reflectivity</option>
      <option value="2">Velocity</option>
      <option value="3">Spectrum Width</option>
      <option value="4">Differential Reflectivity</option>
      <option value="5">Correlation Coefficient</option>
      <option value="6">Differential Phase</option>
    </select>
    <select id="tilt" class="ctl" aria-label="Elevation"><option value="">—</option></select>
    <select id="speed" class="ctl" aria-label="Playback speed">
      <option value=".5">0.5×</option><option value="1" selected>1×</option>
      <option value="2">2×</option><option value="4">4×</option>
    </select>
    <button id="play" class="ctl" type="button">Play</button>
    <button id="tracks" class="ctl active" type="button">Tracks</button>
  </div>

  <div id="readout"><span id="coords">—</span><span id="value">—</span></div>

  <div id="timelineWrap">
    <div id="cacheProgress"><div></div></div>
    <input id="timeline" type="range" min="0" max="0" step="1" value="0" aria-label="Radar frame">
    <div id="times"><span id="timeLeft">—</span><span id="timeNow">—</span><span id="timeRight">—</span></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
