name: Build and deploy PersonalNWS Alpha

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.13.1"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Normalize Rust formatting
        run: cargo fmt --manifest-path decoder/Cargo.toml

      - name: Verify Rust formatting
        run: cargo fmt --manifest-path decoder/Cargo.toml -- --check

      - name: Compile exact NEXRAD API contract
        run: cargo test --manifest-path decoder/Cargo.toml --test dependency_api

      - name: Run Rust tests
        run: cargo test --manifest-path decoder/Cargo.toml

      - name: Check decoder for browser WASM
        run: cargo check --manifest-path decoder/Cargo.toml --target wasm32-unknown-unknown

      - name: Build Rust decoder WASM
        run: npm run build:decoder

      - name: Verify decoder artifacts
        run: |
          test -f public/decoder/personalnws_decoder.js
          test -f public/decoder/personalnws_decoder_bg.wasm

      - name: Run JavaScript tests
        run: npm test

      - name: Refresh active NEXRAD station catalog
        run: node scripts/refresh-radar-catalog.mjs

      - name: Verify full WSR-88D radar catalog
        run: |
          node -e "const fs=require('fs'); const sites=JSON.parse(fs.readFileSync('src/data/nexrad-sites.json','utf8')); if (!Array.isArray(sites) || sites.length < 150) throw new Error('radar catalog contains fewer than 150 WSR-88D sites'); console.log('radar catalog contains', sites.length, 'WSR-88D sites (>= 150)');"

      - name: Build PersonalNWS web app
        env:
          VITE_BUILD_ID: ${{ github.sha }}
        run: npm run build

      - name: Stamp Pages build identity
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const info = {
            release: 'Alpha',
            gitSha: process.env.GIT_SHA,
            builtAt: new Date().toISOString(),
          };
          fs.writeFileSync('dist/build-info.json', `${JSON.stringify(info, null, 2)}\n`);
          console.log('Stamped dist/build-info.json', info);
          NODE

      - name: Audit final Pages artifact
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/build-info.json
          test -f dist/decoder/personalnws_decoder.js
          test -f dist/decoder/personalnws_decoder_bg.wasm
          grep -Fq '<title>PersonalNWS Alpha</title>' dist/index.html
          grep -Fq 'Copy Debug Report' dist/index.html
          grep -R -Fq '#timeNow{font-size:16px;font-weight:850' dist/assets
          grep -Fq '"release": "Alpha"' dist/build-info.json
          grep -Fq "$GIT_SHA" dist/build-info.json
          echo "Final Pages artifact contains Alpha UI/debug/timestamp changes for $GIT_SHA"

      - name: Verify decoder survives the final Pages build
        run: |
          test -f dist/decoder/personalnws_decoder.js
          test -f dist/decoder/personalnws_decoder_bg.wasm

      - name: Download a current real Level II smoke volume
        run: node scripts/fetch-current-smoke-volume.mjs

      - name: Prove the Rust decoder handles current Level II
        run: |
          SITE="$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('tests/fixtures/current-smoke.json','utf8')).site)")"
          cargo run --manifest-path decoder/Cargo.toml --example decode_smoke -- \
            tests/fixtures/current-smoke-volume "$SITE"

      - name: Install Chromium for real browser radar smoke test
        run: npx playwright install --with-deps chromium

      - name: Run Alpha browser radar smoke
        id: alpha_browser_smoke
        continue-on-error: true
        run: npm run test:browser -- tests/browser/real-frame.spec.js

      - name: Upload browser smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-browser-smoke-${{ github.sha }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

      - name: Warn when Alpha browser smoke fails
        if: steps.alpha_browser_smoke.outcome == 'failure'
        run: echo "::warning::Alpha browser radar smoke failed. Pages will still deploy so the current Alpha can be tested with runtime diagnostics."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Pages deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          info=""
          html=""
          for attempt in {1..12}; do
            info="$(curl -fsSL -H 'Cache-Control: no-cache' "$base/build-info.json?build=$GITHUB_SHA" 2>/dev/null || true)"
            html="$(curl -fsSL -H 'Cache-Control: no-cache' "$base/?build=$GITHUB_SHA" 2>/dev/null || true)"
            if [[ "$info" == *"$GITHUB_SHA"* ]] && [[ "$info" == *'"release": "Alpha"'* ]] && [[ "$html" == *'<title>PersonalNWS Alpha</title>'* ]]; then
              echo "Live Pages origin is serving PersonalNWS Alpha from commit $GITHUB_SHA"
              exit 0
            fi
            echo "Live Pages has not propagated commit $GITHUB_SHA yet (attempt $attempt/12)"
            sleep 5
          done
          echo "::error::GitHub Pages did not serve the just-deployed Alpha commit $GITHUB_SHA after 60 seconds."
          echo "PAGE_URL=$PAGE_URL"
          echo "Last build-info response: $info"
          echo "Live HTML title line:"
          printf '%s\n' "$html" | grep -i '<title>' || true
          exit 1
